name: Grade Evaluation Crawler

on:
  workflow_dispatch:
    inputs:
      force_run:
        description: '강제 실행 (월 제한 무시)'
        required: false
        default: false
        type: boolean
      evaluation_date:
        description: '평가 기준연월 (YYYYMM, 예: 202512)'
        required: false
        default: ''
        type: string
      use_cache:
        description: '캐시 사용 (이미 수집된 지점 건너뛰기)'
        required: false
        default: true
        type: boolean

concurrency:
  group: grade-eval-crawler
  cancel-in-progress: false

jobs:
  collect_grades:
    runs-on: ubuntu-24.04
    container:
      image: python:3.12-slim
    outputs:
      changed: ${{ steps.verify-changed-files.outputs.changed }}
    timeout-minutes: 180
    env:
      TZ: Asia/Seoul
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Install Git
        run: |
          apt-get update
          apt-get install -y git
          git config --global --add safe.directory /__w/kfcc-Rates-Api/kfcc-Rates-Api

      - name: Checkout code
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Checkout api-data branch
        uses: actions/checkout@v4.2.2
        with:
          ref: api-data
          path: api-data
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Cache pip dependencies
        uses: actions/cache@v4.2.3
        with:
          path: /root/.cache/pip
          key: pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create data directories
        run: mkdir -p data/grades

      - name: Run grade crawler (with retry)
        uses: nick-fields/retry@v3.0.2
        with:
          timeout_minutes: 20
          max_attempts: 3
          command: |
            CMD="python src/main.py --grades --base-dir api-data"
            if [ -n "${{ github.event.inputs.evaluation_date }}" ]; then
              CMD="$CMD --date ${{ github.event.inputs.evaluation_date }}"
            fi
            if [ "${{ github.event.inputs.use_cache }}" = "true" ]; then
              CMD="$CMD --use-cache"
            fi
            $CMD
        env:
          FORCE_RUN: ${{ github.event.inputs.force_run }}

      - name: Check for changes
        id: verify-changed-files
        run: |
          cd api-data
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          cd api-data
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/grades/
          git add v2/grades/
          [ -f "CNAME" ] && git add CNAME
          git commit -m "비정기 크롤링: 경영실태평가 데이터 업데이트 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M:%S KST')" || exit 0
          git push origin api-data

      - name: Upload data as artifact
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: grade-data-${{ github.run_number }}
          path: api-data/data/grades/
          retention-days: 30

  deploy:
    needs: collect_grades
    if: needs.collect_grades.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout api-data branch
        uses: actions/checkout@v4
        with:
          ref: api-data
          path: api-data

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Copy Static Files to v2
        run: |
          if [ -f "CNAME" ]; then
            cp CNAME api-data/v2/
            echo "✅ CNAME copied to v2/"
          fi
          if [ -f "robots.txt" ]; then
            cp robots.txt api-data/v2/
            echo "✅ robots.txt copied to v2/"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './api-data/v2'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Trigger Frontend Revalidation
        if: success()
        run: |
          echo "🚀 Deployment successful. Triggering revalidation..."
          curl -X POST "${{ secrets.SITE_URL }}/api/revalidate" \
               -H "x-revalidate-secret: ${{ secrets.REVALIDATE_SECRET }}" \
               -H "Content-Type: application/json" \
               -H "User-Agent: MGija-Sync-Engine/2.1" \
               -d '{"tags": ["main", "summary", "rates", "branch", "status"]}' \
               --retry 3 \
               --retry-delay 5 \
               --max-time 30 \
               --fail