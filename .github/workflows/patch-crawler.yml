name: Scheduled mBank Patch Crawler

# on:
#   schedule:
#     # 한국 시간(KST) 매일 07:50, 09:50, 11:50, 13:50, 15:50, 17:50, 20:50 (UTC 기준 매일 22:50, 00:50, 02:50, 04:50, 06:50, 08:50, 11:50) 정각 실행
#     - cron: '50 22,0,2,4,6,8,11 * * *'
on:
  workflow_dispatch:
    inputs:
      regions:
        description: '패치할 지역 (콤마로 구분)'
        required: false
        default: 'all'
        type: string

jobs:
  patch:
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim
    outputs:
      changed: ${{ steps.verify-changed-files.outputs.changed }}
    env:
      TZ: Asia/Seoul
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Install Git
        run: |
          apt-get update
          apt-get install -y git
          git config --global --add safe.directory /__w/kfcc-Rates-Api/kfcc-Rates-Api

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Checkout api-data branch
        uses: actions/checkout@v4
        with:
          ref: api-data
          path: api-data
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run patch crawler
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python src/main.py --mode patch --base-dir api-data
          else
            python src/main.py --mode patch --base-dir api-data
          fi

      - name: Check for changes
        id: verify-changed-files
        run: |
          cd api-data
          if [ -n "$(git status --porcelain v2/)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push V2 changes to api-data
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          cd api-data
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add v2/
          git commit -m "MG더뱅킹 패치: 모바일뱅킹 데이터 업데이트 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M:%S KST')" || exit 0
          git push origin api-data

  deploy:
    needs: patch
    if: needs.patch.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout api-data branch
        uses: actions/checkout@v4
        with:
          ref: api-data
          path: api-data

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Copy Static Files to v2
        run: |
          if [ -f "CNAME" ]; then
            cp CNAME api-data/v2/
            echo "✅ CNAME copied to v2/"
          fi
          if [ -f "robots.txt" ]; then
            cp robots.txt api-data/v2/
            echo "✅ robots.txt copied to v2/"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './api-data/v2'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Trigger Frontend Revalidation
        if: success()
        run: |
          echo "🚀 Deployment successful. Triggering revalidation..."
          curl -X POST "${{ secrets.SITE_URL }}/api/revalidate" \
               -H "x-revalidate-secret: ${{ secrets.REVALIDATE_SECRET }}" \
               -H "Content-Type: application/json" \
               -H "User-Agent: MGija-Sync-Engine/2.1" \
               -d '{"tags": ["main", "summary", "rates", "branch", "status"]}' \
               --retry 3 \
               --retry-delay 5 \
               --max-time 30 \
               --fail

